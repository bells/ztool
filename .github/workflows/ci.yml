name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        if: runner.os == 'macOS'
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Build and audit Zero File PDF engine path
        if: runner.os == 'Windows'
        run: |
          pnpm file-engine:build
          node --test tests/integration/sourceContracts/fileEnginePackaging.test.mjs

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Benchmark Quick Launcher search
        if: runner.os == 'macOS'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --test quick_launcher_benchmark -- --ignored --nocapture

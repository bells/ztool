[package]
name = "zero"
version = "0.1.0"
description = "A Tauri App"
authors = ["watson"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11.0", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-positioner = { version = "2.3.1", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
getrandom = "0.3"
ed25519-dalek = "2"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = "0.13.3"
sha2 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync"] }
wallpaper = { version = "3.2", default-features = false }
nucleo-matcher = "0.3"
pinyin = "0.11"
notify = "8"
plist = "1"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
cocoa = "0.26.1"
objc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes", "objc2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSError", "NSString", "NSObject"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKPDFConfiguration", "block2", "objc2-core-foundation"] }
window-vibrancy = "0.7.1"
xcap = "0.9.8"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
fuzzy-matcher = "0.3"
